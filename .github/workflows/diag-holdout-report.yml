name: DIAG Final Holdout Report (one-off, Faza 5.6)

# JEDNORAZOWA analiza -- Faza 5.6, FINAL HOLDOUT EVALUATION. Pobiera
# WYLACZNIE juz istniejacy artefakt z jednorazowego holdout runu
# (workflow "Phase 5.3c Baseline Walk-Forward", run 37346815021,
# window_start=2022-01-01, run_id=walk-forward-baseline-
# 2026-10-05T171553Z) i liczy opisowa agregacje (score/rank stability,
# paired WITH/WITHOUT valuation, zero-candidate dates) na juz
# persystowanych wynikach. NIE uruchamia zadnego nowego backtestu,
# NIE dotyka configu, NIE wybiera konfiguracji -- to czysty read-only
# raport nad danymi, ktore juz istnieja.
#
# Ten plik i scripts/diag_holdout_report.py zostana usuniete z obu
# branchy po wyciagnieciu wynikow (ten sam wzorzec co wczesniejsze
# diag_*.py w tym projekcie).

on:
  workflow_dispatch:
    inputs:
      holdout_run_id:
        description: "ID uruchomienia holdout walk-forward (Phase 5.3c)"
        required: true
        default: "37346815021"

jobs:
  holdout-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy jednostkowe (pelny zestaw przed runem)
        run: python -m pytest -q

      - name: Pobranie artefaktu holdout runu (Faza 5.6, bez ponownego liczenia backtestu)
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.holdout_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Holdout report (zero sieci, read-only, zero zmiany configu)
        run: python scripts/diag_holdout_report.py --db baseline_walk_forward_result.db
        env:
          PYTHONPATH: .
