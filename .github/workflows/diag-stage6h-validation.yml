name: DIAG Faza 6h Stage 2 validation (TARGETED FIELD REPAIR, 5 historycznych finalistów)

# Jednorazowy workflow diagnostyczny (Faza 6h). ROZSTRZYGAJĄCY LIVE
# VALIDATION TEST mechanizmu TARGETED FIELD REPAIR (commit 05b1b33,
# zastępuje full-response retry z Faz 6f/6g) WYLACZNIE dla 5
# historycznych finalistow (CBOE/PAYX/DECK/INTU/ACN) z FINAL FULL LIVE
# MVP RUN (run_id live-scan-2026-10-06T083825543395Z). Cel: operacyjna
# walidacja mechanizmu -- NIE ponowny wybor kandydatow, NIE kalibracja.
#
# Pobiera historyczny artefakt (phase6-live-scan-result) jako
# READ-ONLY zrodlo deterministycznych danych, seeduje NOWY, osobny
# run_id kopiujac 1:1 juz policzone wartosci (zero nowego decline
# screeningu/ranking/TOP-20), potem wola NIEZMIENIONY normalny
# produkcyjny `analyze-live-scan-shortlist` (1 full call + max 1
# targeted repair call per ticker, Faza 6h). Historyczny run_id tylko
# odczytany, nigdy modyfikowany. Dodatkowy krok raportujacy wypisuje
# szczegolowy per-ticker rozklad (status/error/repair/telemetria
# rozdzielona FULL vs REPAIR) niezaleznie od tego, czy koncowy raport
# TOP-N zostal wygenerowany.
#
# Narzedzie operacyjne/diagnostyczne -- usuniete po uzyciu.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: >
          ID uruchomienia GH Actions "Phase 6 Live End-to-End Scan",
          ktorego artefakt (phase6-live-scan-result, zawiera
          live_scan_result.db z historycznym run_id/analizami) ma
          zostac pobrany jako zrodlo deterministycznych danych.
        required: true
        default: "37437405189"

jobs:
  validate-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy jednostkowe (pelny zestaw przed walidacja)
        run: python -m pytest -q

      - name: Pobranie historycznej bazy (immutable audit -- tylko odczyt)
        uses: actions/download-artifact@v4
        with:
          name: phase6-live-scan-result
          path: historical-result
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kopia bazy do walidacji (historical-result/live_scan_result.db zostaje nietkniety)
        run: cp historical-result/live_scan_result.db live_scan_result.db

      - name: Seed nowego run_id z 5 historycznymi finalistami (zero decline screening/ranking)
        run: |
          VALIDATION_RUN_ID=$(python scripts/seed_stage6h_validation_run.py --db live_scan_result.db | tail -n1)
          echo "VALIDATION_RUN_ID=$VALIDATION_RUN_ID" >> "$GITHUB_ENV"
          echo "Seeded: $VALIDATION_RUN_ID"
        env:
          PYTHONPATH: .

      - name: Stage 2 (normalny produkcyjny kod po Fazie 6h, REALNE wywolania Claude) dla 5 finalistow
        run: |
          python -m buffett_scanner.cli --db live_scan_result.db analyze-live-scan-shortlist \
            --run-id "$VALIDATION_RUN_ID" --limit 5 --markdown-out reports
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Szczegolowy per-ticker raport (status/error/repair/telemetria rozdzielona)
        if: always()
        run: python scripts/report_stage6h_validation_run.py --db live_scan_result.db --run-id "$VALIDATION_RUN_ID"
        env:
          PYTHONPATH: .

      - name: Upload wyniku walidacji (osobny artefakt, NIE nadpisuje historycznego)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6h-validation-result
          path: |
            reports/
            live_scan_result.db
          if-no-files-found: warn
          retention-days: 30
