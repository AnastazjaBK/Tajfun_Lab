name: DIAG FMP European Listing Test (one-off)

# Jednorazowy techniczny test (Faza 7 KROK 7, Decyzja właścicielki pkt
# 6): czy istniejący klient FMP rozpoznaje europejskie listingi
# (Schneider Electric, GSK). ZERO Claude API, ZERO zapisu do bazy.
# Narzędzie diagnostyczne, do usunięcia po wyciągnięciu wyniku.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m buffett_scanner.providers.fmp_european_listing_test
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
