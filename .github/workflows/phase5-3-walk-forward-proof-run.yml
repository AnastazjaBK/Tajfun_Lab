name: Phase 5.3 Walk-Forward Backtest Proof Run

# Reczne uruchomienie z przegladarki. Maly Proof Run deterministycznego
# walk-forward backtest harnessu (sekcja 13), zaprojektowanego i
# zatwierdzonego przez wlascicielke 2026-10-01, PRZED pelnym backfillem.
#
# 3 stabilne tozsamosciowo spolki (AAPL/MSFT/KO) x 6 dat decyzji na
# znanym okresie zmiennosci rynku. Sprawdza: point-in-time (jawna
# asercja), brak look-ahead, pelny funnel (decline scanner -> prefilter
# -> deterministic score -> hard gates -> candidate), forward returns
# 1m/3m/6m/12m, pelny decision snapshot.
#
# CELOWO bez pelnego LLM (full_score zawsze None). Pokrywa 11 z 12
# wymaganych pol fundamentalnych (dependency audit 2026-10-01/02),
# wlacznie z kompozytem EBITDA (OperatingIncomeLoss + D&A); total_debt
# jawnie None (decyzja o kompozycie current/noncurrent jeszcze
# nierozstrzygnieta) -- patrz docstringi modulow. WYLACZNIE
# DIAGNOSTYCZNE, nic nie zapisuje do bazy.
#
# Wymaga sekretow FMP_API_KEY i SEC_EDGAR_USER_AGENT (oba juz istnieja).

on:
  workflow_dispatch: {}

jobs:
  proof-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy jednostkowe (pelny zestaw przed Proof Run)
        run: python -m pytest -q

      - name: Walk-forward backtest Proof Run (Faza 5.3, przed pelnym backfillem)
        run: python -m buffett_scanner.providers.walk_forward_proof_run
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
