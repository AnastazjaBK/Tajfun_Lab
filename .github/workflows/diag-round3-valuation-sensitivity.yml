name: DIAG Round 3 Valuation Sensitivity (one-off, Faza 5.4d)

# JEDNORAZOWA diagnostyka -- Faza 5.4d, ROUND 3 (robustness/sensitivity,
# NIE optimization, decyzja wlascicielki 2026-10-05). Liczy score/rank/
# classification/valuation-output stability + forward-return diagnostics
# (TYLKO diagnostyczne) dla zamrozonej siatki buffett_scanner.
# calibration_round3.ROUND_3_CANDIDATES. Ten plik workflow i skrypt
# scripts/diag_round3_valuation_sensitivity.py zostana usuniete z obu
# branchy po wyciagnieciu wynikow (ten sam wzorzec co wczesniejsze
# diag_*.py w tym projekcie) -- calibration_round3.py (zamrozona siatka)
# zostaje jako trwaly zapis audytowy.

on:
  workflow_dispatch:
    inputs:
      backfill_run_id:
        description: "ID uruchomienia 'Phase 5.3b Backfill Walk-Forward Data'"
        required: true
      sample_ciks:
        description: "Lista CIK po przecinku -- ogranicza zakres (puste = pelne universe)."
        required: false
        default: ""

jobs:
  round3-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy jednostkowe (pelny zestaw przed runem)
        run: python -m pytest -q

      - name: Pobranie bazy z backfillu (Faza 5.3b)
        uses: actions/download-artifact@v4
        with:
          name: backfill-walk-forward-db
          run-id: ${{ inputs.backfill_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kopia bazy przed diagnostyka (backfill_walk_forward.db zostaje nietkniety jako source data)
        run: cp backfill_walk_forward.db round3_result.db

      - name: Przebudowa universe_membership (ta sama naprawa co w baseline walk-forward)
        run: python -m buffett_scanner.cli --db round3_result.db build-universe-membership --cutoff 2012-01-01
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Klasyfikacja sector_profile z SIC
        run: python -m buffett_scanner.cli --db round3_result.db classify-sector-profiles
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Pobranie cen SPY -- SECONDARY benchmark (diagnostic forward returns)
        run: python -m buffett_scanner.cli --db round3_result.db fetch-spy-benchmark-prices --cutoff 2012-01-01
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Round 3 valuation robustness/sensitivity (zero sieci, okno kalibracyjne hardkodowane, holdout zablokowany)
        run: |
          ARGS="--db round3_result.db"
          if [ -n "${{ inputs.sample_ciks }}" ]; then
            ARGS="$ARGS --sample ${{ inputs.sample_ciks }}"
          fi
          python scripts/diag_round3_valuation_sensitivity.py $ARGS
        env:
          PYTHONPATH: .
