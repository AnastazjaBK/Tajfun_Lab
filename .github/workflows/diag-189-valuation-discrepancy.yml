name: DIAG -- 189 valuation discrepancy investigation (one-off)

# Jednorazowy workflow diagnostyczny (Faza 5.3g, zlecenie wlascicielki
# 2026-10-05): wyjasnia, dlaczego dla 189 kandydatow persisted
# valuation_score=None, a pomocnicza rekomputacja compute_valuation()
# dala implemented=True. ZERO zmian w kodzie produkcyjnym -- ponownie
# uruchamia CALA produkcyjna sciezke (evaluate_candidate_at_date) na
# tych samych wejsciach z tego samego artefaktu i porownuje. Logika w
# scripts/diag_189_valuation_discrepancy.py. Do usuniecia po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      baseline_result_run_id:
        description: "Run ID artefaktu baseline-walk-forward-result-db (POST-DEBT run)"
        required: true
        default: "37272173706"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Pobranie wyniku POST-DEBT baseline walk-forward
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.baseline_result_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostyka 189 rozbieznosci
        run: python3 scripts/diag_189_valuation_discrepancy.py
