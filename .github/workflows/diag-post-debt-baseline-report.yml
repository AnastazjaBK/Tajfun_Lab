name: DIAG -- post-debt baseline report (coverage + paired comparison, one-off)

# Jednorazowy workflow raportowy (Faza 5.3f, Decyzja wlascicielki
# 2026-10-05, punkty 7/8/9): total_debt coverage po implementacji Tier
# 1/Tier 2, valuation coverage + bottleneck wsrod kandydatow, PAIRED
# porownanie WITH vs WITHOUT valuation na identycznym complete-valuation
# subsecie. ZERO zmian w total_debt.py/scoring.py/backtest_harness.py --
# czysty odczyt z artefaktu nowego baseline run (POST-DEBT). Logika w
# scripts/report_post_debt_baseline.py. Do usuniecia (razem ze
# skryptem) po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      baseline_result_run_id:
        description: "Run ID artefaktu baseline-walk-forward-result-db (POST-DEBT run)"
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Pobranie wyniku POST-DEBT baseline walk-forward
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.baseline_result_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Raport coverage + paired comparison (Czesc 1-3)
        run: python3 scripts/report_post_debt_baseline.py
