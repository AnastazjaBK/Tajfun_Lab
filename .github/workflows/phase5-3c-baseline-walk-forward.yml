name: Phase 5.3c Baseline Walk-Forward (deterministic, no LLM)

# Reczne uruchomienie z przegladarki. Pelny BASELINE walk-forward
# (sekcja 13), Decyzja wlascicielki 2026-10-04: monthly decision dates
# 2012+, PIT universe -> price history available at D -> decline
# scanner -> prefilter -> deterministic partial scoring -> deterministic
# hard gates -> candidate selection -> forward returns jako outcome
# labels. ZERO LLM, ZERO zmiany scoring weights/thresholds/hard gates/
# valuation assumptions/deterministic_score_pct methodology wzgledem
# juz zatwierdzonej (Faza 5.3) -- to jest BASELINE przed kalibracja,
# nie optymalizacja.
#
# Wymaga artefaktu z wczesniejszego "Phase 5.3b Backfill Walk-Forward
# Data" -- podaj `backfill_run_id` (ID TEGO konkretnego, juz
# zakonczonego backfillu, z ktorego pobrac baze z cenami/SEC cache).
#
# Faza 5.3c, Decyzja wlascicielki 2026-10-04 -- trzy dodatkowe kroki
# PRZED sama analiza (jedyne miejsca w tym workflow z realnym dostepem
# do sieci): (0) `build-universe-membership` -- PRZEBUDOWA (pelne
# zastapienie, nie dopisanie) na tej samej bazie, naprawia realny blad
# znaleziony przy pierwszym uruchomieniu tego workflow (run 37203999911):
# 4 CIK z dual-class share tickerami (GOOGL/GOOG, UAA/UA, NWSA/NWS,
# FOXA/FOX) mialy NAKLADAJACE SIE przedzialy membership tego samego CIK,
# co crashowalo walk-forward na UNIQUE constraint w backtest_candidates
# -- patrz merge_adjacent_same_cik_intervals (teraz: company-level
# interval union). Ceny/fundamentals/SEC cache z backfillu (614/615 i
# 587/615) NIE sa ponownie pobierane -- przebudowa membership jest
# szybka (SEC company_tickers + fja05680 + FMP historical constituents,
# bez company_facts/price fetchy per-CIK); (1) `classify-sector-profiles`
# -- SIC z SEC Submissions API, naprawia odkryty gap (sector_profile byl
# zawsze 'GENERAL', wiec dcf_owner_earnings bylo blednie stosowane do
# bankow/ubezpieczycieli w datasetcie); (2) `fetch-spy-benchmark-prices`
# -- SECONDARY benchmark (realna historia cen SPY z FMP, ta sama
# konwencja forward price return co kandydaci). Sama analiza
# (`run-baseline-walk-forward`) nadal czyta WYLACZNIE z lokalnego
# pliku DB, zero sieci -- i FAIL FAST, jesli universe_membership_as_of()
# zwroci duplikat CIK dla jakiejkolwiek decision_date (defensywna
# asercja, nigdy cichy DISTINCT).

on:
  workflow_dispatch:
    inputs:
      backfill_run_id:
        description: >
          ID uruchomienia "Phase 5.3b Backfill Walk-Forward Data", z
          ktorego pobrac baze (artefakt backfill-walk-forward-db).
        required: true
      window_start:
        description: "Pierwsza decision_date (YYYY-MM-DD)"
        required: false
        default: "2012-01-01"
      window_end:
        description: "Ostatnia decision_date (YYYY-MM-DD, puste = dzis)"
        required: false
        default: ""
      sample_ciks:
        description: >
          Lista CIK po przecinku (BEZ wiodacych zer) -- ogranicza zakres
          do malego testu przed pelnym runem. Puste = pelne 615/626 CIK.
        required: false
        default: ""

jobs:
  baseline-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy jednostkowe (pelny zestaw przed runem)
        run: python -m pytest -q

      - name: Pobranie bazy z backfillu (Faza 5.3b)
        uses: actions/download-artifact@v4
        with:
          name: backfill-walk-forward-db
          run-id: ${{ inputs.backfill_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kopia bazy przed analiza (backfill_walk_forward.db zostaje nietkniety jako source data)
        run: cp backfill_walk_forward.db baseline_walk_forward_result.db

      - name: Przebudowa universe_membership (naprawa overlapping dual-class intervals, 2026-10-04)
        run: python -m buffett_scanner.cli --db baseline_walk_forward_result.db build-universe-membership --cutoff 2012-01-01
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Klasyfikacja sector_profile z SIC (Faza 5.3c, Decyzja wlascicielki 2026-10-04)
        run: python -m buffett_scanner.cli --db baseline_walk_forward_result.db classify-sector-profiles
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Pobranie cen SPY -- SECONDARY benchmark (Faza 5.3c, Decyzja wlascicielki 2026-10-04)
        run: python -m buffett_scanner.cli --db baseline_walk_forward_result.db fetch-spy-benchmark-prices --cutoff ${{ inputs.window_start }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      - name: Pelny baseline walk-forward (Faza 5.3c, zero LLM, zero sieci)
        run: |
          ARGS="--db baseline_walk_forward_result.db run-baseline-walk-forward --window-start ${{ inputs.window_start }}"
          if [ -n "${{ inputs.window_end }}" ]; then
            ARGS="$ARGS --window-end ${{ inputs.window_end }}"
          fi
          if [ -n "${{ inputs.sample_ciks }}" ]; then
            ARGS="$ARGS --sample ${{ inputs.sample_ciks }}"
          fi
          python -m buffett_scanner.cli $ARGS

      - name: Upload wyniku jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          path: baseline_walk_forward_result.db
          retention-days: 14
