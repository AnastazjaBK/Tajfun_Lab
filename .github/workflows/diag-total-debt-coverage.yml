name: DIAG -- total_debt coverage on full 615-CIK dataset (one-off)

# Jednorazowy workflow diagnostyczny (NIE implementuje total_debt do
# scoringu -- tylko mierzy coverage proponowanej hierarchii, Decyzja
# wlascicielki 2026-10-04 po diagnostyce v1.46). Uzywa juz naprawionego
# wyniku baseline walk-forward (run 37208774401 -- universe_membership
# bez overlapping dual-class intervals, backtest_coverage z realnymi
# 178 decision dates) + sec_company_facts_cache (ten sam od backfillu,
# nieruszony). Reuzywa buffett_scanner.total_debt.compute_total_debt_as_of
# (juz przetestowana, 12 testow jednostkowych) -- zero nowej logiki tu,
# zero zmiany scoringu. Do usuniecia po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      baseline_result_run_id:
        description: "Run ID artefaktu baseline-walk-forward-result-db"
        required: true
        default: "37208774401"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pobranie wyniku baseline walk-forward (universe_membership naprawiony + sec cache)
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.baseline_result_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pomiar coverage total_debt na pelnym 615-CIK zbiorze
        run: |
          python3 - <<'PYEOF'
          import sqlite3
          import json
          import sys
          from collections import Counter

          sys.path.insert(0, ".")
          from buffett_scanner.total_debt import compute_total_debt_as_of

          conn = sqlite3.connect("baseline_walk_forward_result.db")
          conn.row_factory = sqlite3.Row

          decision_dates = [
              r["decision_date"] for r in conn.execute(
                  "SELECT DISTINCT decision_date FROM backtest_coverage ORDER BY decision_date"
              ).fetchall()
          ]
          print(f"Decision dates (z realnego baseline run): {len(decision_dates)}")

          all_ciks = [r["cik"] for r in conn.execute("SELECT DISTINCT cik FROM universe_membership WHERE index_name = 'SP500'").fetchall()]
          print(f"CIK w universe_membership (naprawiony): {len(all_ciks)}")

          print("Wczytywanie sec_company_facts_cache per CIK (raz) ...")
          company_facts_by_cik: dict[str, dict] = {}
          for cik in all_ciks:
              row = conn.execute(
                  "SELECT raw_json FROM sec_company_facts_cache WHERE CAST(cik AS INTEGER) = CAST(? AS INTEGER)",
                  (cik,),
              ).fetchone()
              if row is not None:
                  company_facts_by_cik[cik] = json.loads(row["raw_json"])
          print(f"  {len(company_facts_by_cik)}/{len(all_ciks)} CIK z SEC cache.")

          # membership_as_of w pamieci (ten sam wzorzec co get_universe_membership_as_of,
          # ale bez N zapytan SQL w podwojnej petli -- 178 dat x do 615 CIK).
          membership_rows = conn.execute(
              "SELECT cik, start_date, end_date FROM universe_membership WHERE index_name = 'SP500'"
          ).fetchall()

          def pit_universe_at(date):
              return [
                  r["cik"] for r in membership_rows
                  if r["start_date"] <= date and (r["end_date"] is None or r["end_date"] > date)
              ]

          total_observations = 0
          total_with_value = 0
          variant_counts = Counter()
          reason_counts = Counter()
          by_year = {}  # year -> [observations, with_value]
          cik_ever_has_value = set()
          cik_ever_observed = set()

          for date in decision_dates:
              pit_ciks = pit_universe_at(date)
              year = date[:4]
              by_year.setdefault(year, [0, 0])
              for cik in pit_ciks:
                  cik_ever_observed.add(cik)
                  total_observations += 1
                  by_year[year][0] += 1
                  facts = company_facts_by_cik.get(cik)
                  if facts is None:
                      variant_counts["NO_SEC_CACHE"] += 1
                      continue
                  result = compute_total_debt_as_of(facts, date)
                  variant_counts[result.variant] += 1
                  if result.value is not None:
                      total_with_value += 1
                      by_year[year][1] += 1
                      cik_ever_has_value.add(cik)
                  else:
                      # Grupuj przyczyny None do krotszych kategorii (pelny reason
                      # bywa unikalny per end_date -- grupujemy po pierwszych slowach).
                      if result.reason:
                          if "balance-sheet instant" in result.reason:
                              reason_counts["END_DATE_MISMATCH"] += 1
                          elif "Brakuje" in result.reason:
                              reason_counts["MISSING_ONE_COMPONENT_LTD_FAMILY_EXISTS"] += 1
                          elif "Brak rodziny LongTermDebt" in result.reason:
                              reason_counts["NO_LTD_FAMILY_NO_NOTES_PAYABLE"] += 1
                          else:
                              reason_counts["OTHER"] += 1

          print(f"\n== Coverage na company-date observations (walk-forward, {len(decision_dates)} dat) ==")
          print(f"Suma obserwacji (PIT universe x decision_date): {total_observations}")
          print(f"Z total_debt != None: {total_with_value} ({total_with_value/total_observations*100:.2f}%)")

          print(f"\n== Coverage per rok ==")
          for year in sorted(by_year):
              obs, withval = by_year[year]
              pct = (withval / obs * 100) if obs else 0.0
              print(f"  {year}: {withval}/{obs} ({pct:.1f}%)")

          print(f"\n== Rozklad wariantow (wszystkie obserwacje) ==")
          for variant, count in variant_counts.most_common():
              print(f"  {variant}: {count} ({count/total_observations*100:.1f}%)")

          print(f"\n== Przyczyny None (rozbicie reason, tylko obserwacje z value=None) ==")
          total_none = total_observations - total_with_value
          for reason, count in reason_counts.most_common():
              print(f"  {reason}: {count} ({count/total_none*100:.1f}% z None)" if total_none else f"  {reason}: {count}")

          print(f"\n== Per-CIK (nie per obserwacja) ==")
          print(f"CIK kiedykolwiek obserwowane w PIT universe: {len(cik_ever_observed)}")
          print(f"CIK z total_debt != None CHOCIAZ RAZ: {len(cik_ever_has_value)} ({len(cik_ever_has_value)/len(cik_ever_observed)*100:.1f}%)")
          never_has_value = cik_ever_observed - cik_ever_has_value
          print(f"CIK z total_debt=None ZAWSZE (na kazdej obserwowanej dacie): {len(never_has_value)}")
          if never_has_value:
              sample = sorted(never_has_value)[:30]
              print(f"  Przykladowe CIK (do 30): {sample}")
          PYEOF
