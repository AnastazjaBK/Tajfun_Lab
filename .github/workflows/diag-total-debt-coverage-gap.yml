name: DIAG -- total_debt coverage gap analysis (Tier 2 candidates, one-off)

# Jednorazowy workflow diagnostyczny (Faza 5.3e, Decyzja wlascicielki
# 2026-10-05, po zmierzonym coverage=38.71% w v1.46): sprawdza, czy mozna
# stworzyc bezpieczny Tier 2 dla total_debt bez imputacji/zgadywania/
# double-countingu. ZERO zmian w buffett_scanner/total_debt.py -- Tier 1
# (CURRENT_PLUS_NONCURRENT, NOTES_PAYABLE_ONLY) nietkniety. Uzywa tego
# samego artefaktu co diag-total-debt-coverage (run 37208774401 --
# naprawiony universe_membership + realny backtest_coverage, 178
# decision dates) + sec_company_facts_cache (ten sam od backfillu).
# Logika w scripts/diag_total_debt_coverage_gap.py. Do usuniecia (razem
# ze skryptem) po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      baseline_result_run_id:
        description: "Run ID artefaktu baseline-walk-forward-result-db"
        required: true
        default: "37208774401"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pobranie wyniku baseline walk-forward (universe_membership naprawiony + sec cache)
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.baseline_result_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostyka coverage gap (Czesc A-E)
        run: python3 scripts/diag_total_debt_coverage_gap.py
