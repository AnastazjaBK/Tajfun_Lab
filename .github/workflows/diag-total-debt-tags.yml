name: DIAG -- total_debt SEC XBRL tag diagnostics (one-off)

# Jednorazowy workflow diagnostyczny (NIE implementuje total_debt --
# tylko pokazuje realne dane). Decyzja wlascicielki 2026-10-04 (po
# baseline v1.45): najwazniejsze znalezisko to systemowy brak total_debt
# (valuation_score=None dla 100% kandydatow) -- przed jakakolwiek
# implementacja reguly kompozytu, trzeba zobaczyc REALNE SEC XBRL debt
# facts na reprezentatywnej probce spolek (3 wymagane: AAPL/MSFT/KO +
# kilka o prostym i kilka o bardziej zlozonym zadluzeniu). Uzywa JUZ
# zbackfillowanego sec_company_facts_cache (run 37188908038) -- zero
# nowego fetchu z SEC, zero nowej logiki PIT (reuzywa `point_in_time.
# extract_fact_history`, juz przetestowana funkcja). Nie sumuje tagow,
# nie proponuje kodu -- tylko surowe fakty do analizy.
#
# Do usuniecia po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      backfill_run_id:
        description: "Run ID artefaktu backfill-walk-forward-db"
        required: true
        default: "37188908038"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pobranie bazy z backfillu (Faza 5.3b)
        uses: actions/download-artifact@v4
        with:
          name: backfill-walk-forward-db
          run-id: ${{ inputs.backfill_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostyka tagow debt na reprezentatywnej probce
        run: |
          python3 - <<'PYEOF'
          import sqlite3
          import json
          import sys

          sys.path.insert(0, ".")
          from buffett_scanner.point_in_time import extract_fact_history

          conn = sqlite3.connect("backfill_walk_forward.db")
          conn.row_factory = sqlite3.Row

          # Reprezentatywna probka (3 wymagane + proste + zlozone struktury
          # dlugu), wszystkie CIK potwierdzone realne w tym projekcie.
          SAMPLE = {
              "0000320193": "AAPL (wymagane)",
              "0000789019": "MSFT (wymagane)",
              "0000021344": "KO (wymagane)",
              "0000097210": "TERADYNE (prosty profil -- hipoteza do weryfikacji)",
              "0000898293": "JABIL (prosty profil -- hipoteza do weryfikacji)",
              "0001004980": "PG&E Corp (zlozony profil -- regulowana utility, hipoteza)",
              "0001868275": "Constellation Energy Corp (zlozony profil -- utility/nuclear, hipoteza)",
              "0000033213": "EQT Corp (zlozony profil -- energy, hipoteza)",
              "0000726728": "Realty Income / O (REIT -- sale-leaseback, hipoteza)",
              "0001751788": "DOW INC (zlozony profil -- chemicals/industrial, hipoteza)",
          }

          CANDIDATE_TAGS = [
              # Potencjalne agregaty (jeden fakt = cale zadluzenie)
              "DebtLongtermAndShorttermCombinedAmount",
              "Debt",
              # Current/noncurrent dekompozycja (najczestszy wzorzec)
              "LongTermDebt",
              "LongTermDebtCurrent",
              "LongTermDebtNoncurrent",
              "DebtCurrent",
              "ShortTermBorrowings",
              "ShortTermDebt",
              "CommercialPaper",
              "NotesPayable",
              "NotesPayableCurrent",
              "NotesPayableNoncurrent",
              "LinesOfCreditCurrent",
              "BankOverdrafts",
              # Leasing (ASC 842) -- czy to jest "debt" semantycznie?
              "LongTermDebtAndCapitalLeaseObligations",
              "LongTermDebtAndCapitalLeaseObligationsCurrent",
              "LongTermDebtAndCapitalLeaseObligationsNoncurrent",
              "LongTermDebtAndFinanceLeaseObligations",
              "LongTermDebtAndFinanceLeaseObligationsCurrent",
              "LongTermDebtAndFinanceLeaseObligationsNoncurrent",
              "FinanceLeaseLiability",
              "FinanceLeaseLiabilityCurrent",
              "FinanceLeaseLiabilityNoncurrent",
              "CapitalLeaseObligationsCurrent",
              "CapitalLeaseObligationsNoncurrent",
              "OperatingLeaseLiabilityCurrent",
              "OperatingLeaseLiabilityNoncurrent",
              # Bardziej szczegolowe/rzadsze komponenty
              "SecuredDebtCurrent",
              "SecuredDebtNoncurrent",
              "UnsecuredDebtCurrent",
              "UnsecuredDebtNoncurrent",
              "ConvertibleNotesPayableCurrent",
              "ConvertibleNotesPayableNoncurrent",
              "ConvertibleDebtNoncurrent",
              "JuniorSubordinatedDebenturesNoncurrent",
              "SeniorNotes",
              "SeniorNotesNoncurrent",
              "MediumtermNotesNoncurrent",
              "DebtInstrumentCarryingAmount",
          ]

          for cik, label in SAMPLE.items():
              row = conn.execute(
                  "SELECT raw_json FROM sec_company_facts_cache WHERE cik = ?", (cik,)
              ).fetchone()
              print(f"\n{'='*100}")
              print(f"CIK={cik}  {label}")
              print(f"{'='*100}")
              if row is None:
                  print("  BRAK w sec_company_facts_cache -- pomijam.")
                  continue
              company_facts = json.loads(row["raw_json"])

              found_any = False
              for tag in CANDIDATE_TAGS:
                  facts = extract_fact_history(company_facts, tag)
                  if not facts:
                      continue
                  found_any = True
                  # Unikalne end_date (instant), zeby nie zalewac restatementami
                  # tego samego okresu -- ale pokaz WSZYSTKIE filed per end_date
                  # (to wlasnie jest PIT availability).
                  by_end = {}
                  for f in facts:
                      by_end.setdefault(f.end, []).append(f)
                  last_3_ends = sorted(by_end.keys())[-3:]
                  print(f"\n  TAG: {tag}  ({len(facts)} wpisow lacznie, {len(by_end)} unikalnych end_date)")
                  for end_date in last_3_ends:
                      for f in by_end[end_date]:
                          print(
                              f"    end={f.end} val={f.val:,.0f} filed={f.filed} "
                              f"form={f.form} fy={f.fiscal_year} fp={f.fiscal_period} accn={f.accession_number}"
                          )
              if not found_any:
                  print("  Zero kandydackich tagow znalezionych dla tego CIK.")

              # Podsumowanie: ktore tagi (z najnowszym end_date) wspolistnieja
              # -- surowy material do oceny hierarchii/double-counting, bez
              # automatycznego sumowania.
              print(f"\n  -- Najnowszy snapshot (ostatni end_date per tag) --")
              latest_by_tag = {}
              for tag in CANDIDATE_TAGS:
                  facts = extract_fact_history(company_facts, tag)
                  if facts:
                      latest = max(facts, key=lambda f: (f.end, f.filed))
                      latest_by_tag[tag] = latest.val
              for tag, val in latest_by_tag.items():
                  print(f"    {tag} = {val:,.0f}")
          PYEOF
