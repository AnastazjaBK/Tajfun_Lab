name: FMP Smoke Test

# Ręczne uruchomienie z przeglądarki (zakładka "Actions" na GitHubie,
# przycisk "Run workflow") — bez instalowania czegokolwiek lokalnie.
# Sprawdza, czy założenia w buffett_scanner/providers/fmp.py o kształcie
# odpowiedzi FMP się zgadzają. Klucz FMP_API_KEY brany z sekretu
# repozytorium, nigdy nie pojawia się w logach ani w kodzie.

on:
  workflow_dispatch: {}

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m buffett_scanner.providers.fmp_smoketest
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
