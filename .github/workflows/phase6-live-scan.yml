name: Phase 6 Live End-to-End Scan (CURRENT MARKET, domkniecie MVP V0)

# Reczne uruchomienie z przegladarki. Jedyny workflow, ktory uruchamia
# `run-live-scan` -- CURRENT MARKET -> current universe (aktualne S&P
# 500 z FMP) -> fundamentals -> decline/opportunity screening ->
# deterministic scoring + hard gates -> valuation -> Claude qualitative
# analysis -> anti-confirmation-bias layer -> source assembly/
# validation -> final candidate report (0-N kandydatow, "No qualifying
# opportunities today" jest prawidlowym wynikiem). Decyzja wlascicielki
# 2026-10-05 (po formalnym zamknieciu Fazy 5.4/5.6): live run jest
# testem operacyjnym MVP, NIE kolejna runda kalibracji -- wynik NIE
# zmienia config/config.yaml ani metodologii.
#
# W przeciwienstwie do Fazy 5 (kalibracja/backtest, zero sieci po
# jednorazowym backfillu) ten workflow robi REALNE zapytania do FMP
# (ceny+fundamenty calego uniwersum), SEC EDGAR (source packet) i
# Claude API (jakosciowa analiza + anti-bias) dla kazdego kandydata,
# ktory przejdzie decline screening + prefilter. `sample` pozwala na
# maly test (kilka tickerow) przed pelnym runem na calym S&P 500.
#
# timeout-minutes: 350 (nie domyslne 180) -- podniesione po realnym
# znalezisku 2026-10-05: pelny run na aktualnym rynku wytypowal
# 150/501 tickerow (duzo wiecej niz oczekiwano), kazdy z nich wymaga
# sekwencyjnie fundamentals + source packet (SEC) + 1 wywolania Claude
# API -- pierwszy pelny przebieg z pelnym saldem Anthropic (run
# 37372436386) zostal ucięty dokladnie na starym limicie 180 min
# (179m54s), mimo ze kod dziala poprawnie (potwierdzone wczesniejszym
# pelnym sukcesem na run 37355677202, 79 min, ograniczonym tylko
# wyczerpaniem kredytu Anthropic w polowie, nie timeoutem). 350 min =
# ta sama wartosc, co `phase5-3c-baseline-walk-forward.yml` dla
# analogicznie dlugich, pelnych-uniwersum runow.
#
# Faza 6c (2026-10-06, Decyzja wlascicielki OPCJA 3): pelna analiza
# Claude jest teraz ograniczona do SHORTLISTY (domyslnie TOP 20 po
# deterministic_score_pct, zero LLM -- operacyjny/kosztowy budget, NIE
# nowy prog inwestycyjny), nie do wszystkich decline-surfaced
# kandydatow -- dramatycznie krotszy/tanszy run niz wczesniej. Jesli
# limit Anthropic i tak wyczerpie sie w trakcie (lub trzeba
# `--rank-only` na sam etap 1), uzyj OSOBNEGO workflow
# `phase6b-analyze-live-scan-shortlist.yml` z `run_id` z tego runu i
# ID TEGO uruchomienia (do pobrania artefaktu z baza, ktora ma juz
# zapisany pelny ranking/shortliste) -- analizuje TYLKO
# PENDING/FAILED, nigdy nie placi drugi raz za COMPLETE.
#
# 2026-10-23 (decyzja właścicielki, przygotowanie pełnego skanu):
# - `session_date` obowiązkowe: data skanu = data sesji, ceny najwyżej do
#   niej, dokumenty SEC złożone najpóźniej w tym dniu;
# - kontrola danych PRZED Claude: pokrycie cen i wolumenów sesji, test
#   stabilności notowań (dwa pobrania w odstępie `stability_wait_minutes`
#   i ponownie po pobraniu wszystkich cen), dane finansowe wytypowanych
#   spółek -- naruszenie progu przerywa skan bez kosztów Claude;
# - twardy limit wywołań Claude, plik zużycia i raport scan_report.md;
# - ZERO automatycznej publikacji (token tylko do odczytu). Publikacja po
#   zatwierdzeniu raportu przez właścicielkę: workflow "Backfill -
#   publikacja istniejącego snapshotu" z source_run_id = ID tego
#   uruchomienia (publish-snapshot odrzuca każdy skan bez COMPLETE);
# - kontrola wersji kodu: skan przerywa się, jeśli uruchomiony kod nie ma
#   tych zabezpieczeń (np. stara wersja z innej gałęzi).

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Data sesji NYSE, której dotyczy skan (YYYY-MM-DD), np. 2026-10-23"
        required: true
      sample:
        description: >
          Lista tickerow po przecinku (puste = pelne aktualne S&P 500).
          Mala probka wylacza kontrole wielkosci uniwersum.
        required: false
        default: ""
      limit:
        description: "Maks. liczba finalnych kandydatow w raporcie (domyslnie 5)"
        required: false
        default: "5"
      shortlist_limit:
        description: >
          TOP N po deterministic_score_pct (zero LLM) wysylanych do
          pelnej analizy Claude -- remisy na granicy zachowane.
          Operacyjny/kosztowy budget warstwy research (Faza 6c), NIE
          prog inwestycyjny. Domyslnie 20.
        required: false
        default: "20"
      max_claude_calls:
        description: "Twardy limit wywolan Claude (pelne + naprawy); 75 = 25 spolek x najgorszy przypadek 3"
        required: true
        default: "75"
      stability_wait_minutes:
        description: "Odstep miedzy pobraniami notowan proby spolek (test, ze dane sa ostateczne)"
        required: true
        default: "10"
      rank_only:
        description: >
          true = STOP po etapie 1 (deterministic ranking + shortlist),
          bez wywolania Claude.
        required: false
        default: "false"
      price_days:
        description: "Okno historii cen do decline scanningu (dni)"
        required: false
        default: "400"
      price_input_per_mtok:
        description: "Cena USD za mln tokenow input (do raportu kosztu)"
        required: true
        default: "2"
      price_output_per_mtok:
        description: "Cena USD za mln tokenow output (do raportu kosztu)"
        required: true
        default: "10"

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read  # bez publikacji -- token nie moze utworzyc release'u
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Kontrola wersji kodu i parametrow
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          MAX_CALLS: ${{ inputs.max_claude_calls }}
        run: |
          echo "Kod: ${GITHUB_REF_NAME} @ $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          for flag in --session-date --max-claude-calls --usage-out --data-quality-out; do
            python -m buffett_scanner.cli run-live-scan --help | grep -q -- "$flag" \
              || { echo "::error title=Stary kod::run-live-scan nie ma $flag -- uruchom z gałęzi z poprawkami."; exit 1; }
          done
          python -m buffett_scanner.cli scan-report --help > /dev/null \
            || { echo "::error title=Stary kod::brak polecenia scan-report."; exit 1; }
          python - <<'PY'
          import datetime as dt, os, sys
          raw = os.environ["SESSION_DATE"]
          try:
              day = dt.date.fromisoformat(raw)
          except ValueError:
              sys.exit(f"::error title=Zła data::session_date '{raw}' nie jest datą YYYY-MM-DD.")
          if day > dt.datetime.now(dt.timezone.utc).date():
              sys.exit(f"::error title=Zła data::session_date {raw} jest w przyszłości.")
          if day.weekday() >= 5:
              sys.exit(f"::error title=Zła data::{raw} to weekend -- brak sesji.")
          PY
          [ "$MAX_CALLS" -ge 1 ] 2>/dev/null || { echo "::error title=Zły limit::max_claude_calls musi być liczbą >= 1."; exit 1; }

      - name: Testy jednostkowe (pelny zestaw przed live runem)
        run: python -m pytest -q

      - name: init-db
        run: python -m buffett_scanner.cli --db live_scan_result.db init-db

      - name: LIVE END-TO-END RUN (kontrola danych przed Claude)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SESSION_DATE: ${{ inputs.session_date }}
          SAMPLE: ${{ inputs.sample }}
          LIMIT: ${{ inputs.limit }}
          SHORTLIST_LIMIT: ${{ inputs.shortlist_limit }}
          MAX_CALLS: ${{ inputs.max_claude_calls }}
          STABILITY_WAIT: ${{ inputs.stability_wait_minutes }}
          RANK_ONLY: ${{ inputs.rank_only }}
          PRICE_DAYS: ${{ inputs.price_days }}
        run: |
          set -o pipefail
          mkdir -p reports
          ARGS=(--db live_scan_result.db run-live-scan --session-date "$SESSION_DATE"
                --limit "$LIMIT" --shortlist-limit "$SHORTLIST_LIMIT" --price-days "$PRICE_DAYS"
                --max-claude-calls "$MAX_CALLS" --stability-wait-minutes "$STABILITY_WAIT"
                --data-quality-out reports/data_quality.json --usage-out reports/usage.json
                --markdown-out reports)
          if [ -n "$SAMPLE" ]; then ARGS+=(--sample "$SAMPLE"); fi
          if [ "$RANK_ONLY" = "true" ]; then ARGS+=(--rank-only); fi
          python -m buffett_scanner.cli "${ARGS[@]}" | tee reports/scan_log.txt

      - name: Raport skanu (dane, ranking, analizy, koszt, DCF, look-ahead, metodologia)
        if: always()
        env:
          PRICE_IN: ${{ inputs.price_input_per_mtok }}
          PRICE_OUT: ${{ inputs.price_output_per_mtok }}
        run: |
          python -m buffett_scanner.cli --db live_scan_result.db scan-report \
            --data-quality-json reports/data_quality.json --usage-json reports/usage.json \
            --price-input-per-mtok "$PRICE_IN" --price-output-per-mtok "$PRICE_OUT" --report-out reports

      - name: Walidacja kompletności skanu
        if: always()
        run: python -m buffett_scanner.cli --db live_scan_result.db verify-run-complete --report-out reports

      - name: Upload raportu i bazy (bez publikacji)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-live-scan-result
          path: |
            reports/
            live_scan_result.db
          if-no-files-found: warn
