name: DIAG -- baseline walk-forward report statistics (one-off)

# Jednorazowy workflow (NIE stala czesc pipeline'u) -- liczy
# pozostale statystyki potrzebne do 10-punktowego raportu wlascicielki
# (Decyzja 2026-10-04) z juz wygenerowanego artefaktu "Phase 5.3c
# Baseline Walk-Forward". Czyste odczyty SQL, zero modyfikacji danych.
# Do usuniecia po wykorzystaniu.

on:
  workflow_dispatch:
    inputs:
      result_run_id:
        description: "Run ID artefaktu baseline-walk-forward-result-db"
        required: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobranie wyniku baseline walk-forward
        uses: actions/download-artifact@v4
        with:
          name: baseline-walk-forward-result-db
          run-id: ${{ inputs.result_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Statystyki do raportu
        run: |
          python3 - <<'PYEOF'
          import sqlite3
          import statistics as st

          conn = sqlite3.connect("baseline_walk_forward_result.db")
          conn.row_factory = sqlite3.Row

          run_id = conn.execute(
              "SELECT run_id FROM backtest_coverage ORDER BY created_at DESC LIMIT 1"
          ).fetchone()["run_id"]
          print(f"run_id = {run_id}")

          cov_rows = conn.execute(
              "SELECT * FROM backtest_coverage WHERE run_id = ? ORDER BY decision_date", (run_id,)
          ).fetchall()
          cand_rows = conn.execute(
              "SELECT * FROM backtest_candidates WHERE run_id = ? ORDER BY decision_date, cik", (run_id,)
          ).fetchall()
          bench_rows = conn.execute(
              "SELECT * FROM backtest_benchmark WHERE run_id = ? ORDER BY decision_date", (run_id,)
          ).fetchall()

          print(f"\n== Punkt 1: liczba decision dates i obserwacji ==")
          print(f"decision_dates={len(cov_rows)}")
          print(f"company-date observations (PIT universe suma)={sum(r['pit_universe_count'] for r in cov_rows)}")
          print(f"company-date observations (scanned suma)={sum(r['scanned_count'] for r in cov_rows)}")

          print(f"\n== Punkt 2: pelny funnel (sumy) ==")
          print(f"pit_universe_count={sum(r['pit_universe_count'] for r in cov_rows)}")
          print(f"sufficient_price_count={sum(r['sufficient_price_count'] for r in cov_rows)}")
          print(f"sufficient_fundamentals_count={sum(r['sufficient_fundamentals_count'] for r in cov_rows)}")
          print(f"scanned_count={sum(r['scanned_count'] for r in cov_rows)}")
          print(f"excluded_missing_price_count={sum(r['excluded_missing_price_count'] for r in cov_rows)}")
          print(f"excluded_missing_fundamentals_count={sum(r['excluded_missing_fundamentals_count'] for r in cov_rows)}")
          print(f"stage_no_decline_signal={sum(r['stage_no_decline_signal'] for r in cov_rows)}")
          print(f"stage_excluded_by_prefilter={sum(r['stage_excluded_by_prefilter'] for r in cov_rows)}")
          print(f"stage_hard_gate_failed={sum(r['stage_hard_gate_failed'] for r in cov_rows)}")
          print(f"stage_candidate={sum(r['stage_candidate'] for r in cov_rows)}")

          print(f"\n== Punkt 4: kandydaci w czasie ==")
          by_year = {}
          by_month_count = []
          zero_candidate_months = []
          for r in cov_rows:
              year = r["decision_date"][:4]
              by_year[year] = by_year.get(year, 0) + r["stage_candidate"]
              by_month_count.append(r["stage_candidate"])
              if r["stage_candidate"] == 0:
                  zero_candidate_months.append(r["decision_date"])
          for year in sorted(by_year):
              print(f"  {year}: {by_year[year]}")
          print(f"Mediana kandydatow/miesiac: {st.median(by_month_count)}")
          print(f"Miesiace z 0 kandydatow: {len(zero_candidate_months)} -> {zero_candidate_months}")

          print(f"\n== Punkt 5: rozklad deterministic_score_pct / valuation / MoS / komponentow (n={len(cand_rows)}) ==")
          def _dist(vals, label):
              vals = [v for v in vals if v is not None]
              if not vals:
                  print(f"  {label}: brak danych (wszystkie None)")
                  return
              q = st.quantiles(vals, n=4, method="inclusive") if len(vals) >= 2 else [vals[0]] * 3
              print(
                  f"  {label}: n={len(vals)} min={min(vals):.2f} p25={q[0]:.2f} median={st.median(vals):.2f} "
                  f"p75={q[2]:.2f} max={max(vals):.2f} mean={st.mean(vals):.2f}"
              )

          _dist([r["deterministic_score_pct"] for r in cand_rows], "deterministic_score_pct")
          _dist([r["safety_score"] for r in cand_rows], "safety_score")
          _dist([r["dividend_score"] for r in cand_rows], "dividend_score")
          _dist([r["valuation_score"] for r in cand_rows], "valuation_score")
          _dist([r["margin_of_safety_base_pct"] for r in cand_rows], "margin_of_safety_base_pct")
          n_valuation_available = sum(1 for r in cand_rows if r["valuation_score"] is not None)
          print(f"  walucja dostepna dla {n_valuation_available}/{len(cand_rows)} kandydatow ({n_valuation_available/len(cand_rows)*100:.1f}%)")

          available_components_counts = {}
          for r in cand_rows:
              key = r["available_components"]
              available_components_counts[key] = available_components_counts.get(key, 0) + 1
          print("  available_components breakdown:")
          for key, count in sorted(available_components_counts.items(), key=lambda kv: -kv[1]):
              print(f"    {key}: {count}")

          print(f"\n== Punkt 6: forward returns kandydatow ==")
          for h in ("1m", "3m", "6m", "12m"):
              _dist([r[f"return_{h}_pct"] for r in cand_rows], f"return_{h}_pct")

          print(f"\n== Punkt 7/8: benchmark -- excess return, hit rate, rozklad (per horyzont) ==")
          bench_by_date = {r["decision_date"]: r for r in bench_rows}
          for h in ("1m", "3m", "6m", "12m"):
              ew_excess, spy_excess = [], []
              ew_hits, spy_hits = 0, 0
              n_pairs = 0
              for c in cand_rows:
                  c_ret = c[f"return_{h}_pct"]
                  if c_ret is None:
                      continue
                  b = bench_by_date.get(c["decision_date"])
                  if b is None:
                      continue
                  ew_ret = b[f"ew_pit_universe_return_{h}_pct"]
                  spy_ret = b[f"spy_return_{h}_pct"]
                  if ew_ret is not None:
                      ew_excess.append(c_ret - ew_ret)
                      if c_ret > ew_ret:
                          ew_hits += 1
                  if spy_ret is not None:
                      spy_excess.append(c_ret - spy_ret)
                      if c_ret > spy_ret:
                          spy_hits += 1
                  n_pairs += 1
              print(f"  horyzont {h}: n_kandydatow_z_returnem={n_pairs}")
              if ew_excess:
                  print(
                      f"    vs equal_weighted_pit_universe: n={len(ew_excess)} hit_rate={ew_hits/len(ew_excess)*100:.1f}% "
                      f"mean_excess={st.mean(ew_excess):.2f} median_excess={st.median(ew_excess):.2f} "
                      f"min={min(ew_excess):.2f} max={max(ew_excess):.2f}"
                  )
              if spy_excess:
                  print(
                      f"    vs SPY: n={len(spy_excess)} hit_rate={spy_hits/len(spy_excess)*100:.1f}% "
                      f"mean_excess={st.mean(spy_excess):.2f} median_excess={st.median(spy_excess):.2f} "
                      f"min={min(spy_excess):.2f} max={max(spy_excess):.2f}"
                  )

          print(f"\n== Punkt 9: ograniczenia danych ==")
          sector_counts = conn.execute(
              "SELECT sector_profile, COUNT(*) AS n FROM companies GROUP BY sector_profile"
          ).fetchall()
          print("  sector_profile breakdown (companies):", {r["sector_profile"]: r["n"] for r in sector_counts})
          backfill_counts = conn.execute(
              "SELECT task_type, status, COUNT(*) AS n FROM backfill_status GROUP BY task_type, status ORDER BY task_type, status"
          ).fetchall()
          print("  backfill_status breakdown:")
          for r in backfill_counts:
              print(f"    {r['task_type']} {r['status']}: {r['n']}")
          PYEOF
