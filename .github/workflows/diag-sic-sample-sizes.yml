name: Diagnostyka SIC i liczebności (SEC + FMP w abonamencie, bez Claude)

# Zgoda właścicielki 2026-10-24 (z korektą: FMP dozwolone w ramach abonamentu).
# SEC EDGAR (throttling poniżej limitu 10 zapytań/s) do SIC i danych
# historycznych; FMP do aktualnego składu indeksu i surowych pól cash flow;
# odczyt istniejącego artefaktu kalibracji i snapshotu z 22.10. Bez Claude,
# bez publikacji, bez zmian metodologii/scoringu/wyników historycznych.
# Token tylko do odczytu.
# Uruchamiana WYŁĄCZNIE z gałęzi roboczej, z potwierdzeniem commitu.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Pełny SHA commitu gałęzi roboczej, który ma zostać uruchomiony"
        required: true
      mode:
        description: "sic = diagnostyka SIC i liczebności; preferred-dividends = kontrola dywidend uprzywilejowanych; rerank = korekta danych i rankingu istniejącego skanu, bez Claude (zgoda 2026-10-25)"
        required: false
        default: "sic"
      live_run_id:
        description: "Tryb rerank: run_id skanu w bazie"
        required: false
        default: "live-scan-2026-10-24T220005090685Z"
      scan_run_id:
        description: "Tryby preferred-dividends/rerank: run skanu (artefakt phase6-live-scan-result)"
        required: false
        default: "40136571596"
      max_ciks:
        description: "Test na małej próbie: liczba CIK z każdego zbioru (0 = pełna diagnostyka)"
        required: false
        default: "0"
      calibration_run_id:
        description: "Run kalibracji Round 1 baseline (artefakt calibration-round1-baseline-db)"
        required: false
        default: "37313299445"
      snapshot_tag:
        description: "Release ze snapshotem skanu 22.10"
        required: false
        default: "scanner-snapshot-live-scan-2026-10-22T202049554465Z"
      snapshot_sha256:
        description: "Oczekiwany SHA256 snapshotu"
        required: false
        default: "69e6785df0de6991ad27b9dfdf315278adeaa096e6423286ad14c89d0f7ce0e2"

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Kontrola gałęzi i commitu
        run: |
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} expected=${{ inputs.expected_sha }}"
          if [ "${GITHUB_REF}" != "refs/heads/claude/buffett-scanner-design-review-mrud89" ]; then
            echo "STOP: diagnostyka tylko z gałęzi roboczej"; exit 1
          fi
          if [ "${GITHUB_SHA}" != "${{ inputs.expected_sha }}" ]; then
            echo "STOP: commit ${GITHUB_SHA} różny od oczekiwanego"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Potwierdzenie commitu
        run: git log -1 --format='commit %H%n%s'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testy skryptu diagnostycznego (offline)
        if: inputs.mode == 'sic'
        run: python -m pytest -q tests/test_diag_sic_and_sample_sizes.py

      - name: "[rerank] Testy (pełny zestaw)"
        if: inputs.mode == 'rerank'
        run: python -m pytest -q

      - name: "[rerank] Baza skanu"
        if: inputs.mode == 'rerank'
        uses: actions/download-artifact@v4
        with:
          name: phase6-live-scan-result
          path: previous-result
          run-id: ${{ inputs.scan_run_id }}
          github-token: ${{ github.token }}

      - name: "[rerank] Korekta danych i rankingu (SEC + FMP, bez Claude)"
        if: inputs.mode == 'rerank'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          [ -z "${ANTHROPIC_API_KEY:-}" ] || { echo "STOP: brak dostępu do Claude w tym trybie"; exit 1; }
          sha256sum previous-result/live_scan_result.db
          cp previous-result/live_scan_result.db live_scan_result.db
          cp -r previous-result/reports reports
          python -m buffett_scanner.cli --db live_scan_result.db rerank-live-scan \
            --run-id "${{ inputs.live_run_id }}" --report-out reports

      - name: "[rerank] Wynik (baza do wznowienia przez phase6b, bez publikacji)"
        if: always() && inputs.mode == 'rerank'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-live-scan-result
          path: |
            reports/
            live_scan_result.db
          retention-days: 30
          if-no-files-found: warn

      - name: "[preferred-dividends] Testy skryptu (offline)"
        if: inputs.mode == 'preferred-dividends'
        run: python -m pytest -q tests/test_diag_preferred_dividends.py

      - name: "[preferred-dividends] Baza skanu (tylko odczyt)"
        if: inputs.mode == 'preferred-dividends'
        uses: actions/download-artifact@v4
        with:
          name: phase6-live-scan-result
          run-id: ${{ inputs.scan_run_id }}
          github-token: ${{ github.token }}

      - name: "[preferred-dividends] Diagnostyka (SEC + FMP, bez Claude)"
        if: inputs.mode == 'preferred-dividends'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          sha256sum live_scan_result.db
          python scripts/diag_preferred_dividends.py --scan-db live_scan_result.db --out diag_preferred_dividends.json

      - name: "[preferred-dividends] Wynik jako artefakt"
        if: always() && inputs.mode == 'preferred-dividends'
        uses: actions/upload-artifact@v4
        with:
          name: diag-preferred-dividends
          path: diag_preferred_dividends.json
          retention-days: 30
          if-no-files-found: warn

      - name: Artefakt kalibracji (tylko odczyt)
        if: inputs.mode == 'sic'
        uses: actions/download-artifact@v4
        with:
          name: calibration-round1-baseline-db
          run-id: ${{ inputs.calibration_run_id }}
          github-token: ${{ github.token }}

      - name: Snapshot 22.10 (tylko odczyt) i kontrola SHA256
        if: inputs.mode == 'sic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.snapshot_tag }}" -p live_scan_result.db -R "${GITHUB_REPOSITORY}"
          echo "${{ inputs.snapshot_sha256 }}  live_scan_result.db" | sha256sum -c -
          sha256sum calibration_result.db

      - name: Diagnostyka (SEC + FMP, bez Claude)
        if: inputs.mode == 'sic'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python scripts/diag_sic_and_sample_sizes.py \
            --calibration-db calibration_result.db \
            --snapshot-db live_scan_result.db \
            --out diag_sic_sample_sizes.json \
            --max-ciks "${{ inputs.max_ciks }}"

      - name: Wynik jako artefakt
        if: always() && inputs.mode == 'sic'
        uses: actions/upload-artifact@v4
        with:
          name: diag-sic-sample-sizes
          path: diag_sic_sample_sizes.json
          retention-days: 30
          if-no-files-found: warn
